services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asana-coach
    ports:
      - "8000:8000"
    environment:
      # Put your key in a .env file next to this compose file (compose reads it automatically).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      ASANAS_PATH: /app/backend/asanas.json
      PUBLIC_DIR: /app/public
    restart: unless-stopped
